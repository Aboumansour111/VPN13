name: Build VPN13 Xray Universal APK

on:
  push:
    branches:
      - feature/claude-redesign-xray
    paths:
      - ".github/workflows/build-xray-universal.yml"
      - "client/android/app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-universal:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PUB_CACHE: ${{ github.workspace }}\\.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Prepare Android project and Xray core
        shell: pwsh
        run: |
          .\\scripts\\ensure-client-android-scaffold.ps1
          .\\scripts\\setup-xray-core.ps1
          py -3 .\\scripts\\set-android-min-sdk.py .\\client
          if ($LASTEXITCODE -ne 0) { throw "Setting Android minSdk failed." }

      - name: Resolve Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: client
        run: dart run flutter_launcher_icons

      - name: Analyze and test
        working-directory: client
        shell: pwsh
        run: |
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw "Flutter analyze failed." }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed." }

      - name: Build universal release APK
        working-directory: client
        run: flutter build apk --release

      - name: Verify universal APK architectures
        shell: pwsh
        run: |
          $apk = ".\\client\\build\\app\\outputs\\flutter-apk\\app-release.apk"
          if (!(Test-Path $apk)) { throw "Universal APK not found." }
          jar tf $apk | Select-String "lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/" | ForEach-Object { $_.Line } | Set-Content abi-list.txt
          $abis = Get-Content abi-list.txt
          $abis | Write-Host
          if (!($abis -match "arm64-v8a")) { throw "Universal APK is missing ARM64 libraries." }
          if (!($abis -match "armeabi-v7a|x86_64|x86")) { throw "No additional ABI libraries were packaged; this is not a multi-architecture APK." }

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN13-Xray-Android-Universal
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
