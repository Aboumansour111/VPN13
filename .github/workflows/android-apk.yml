name: Build VPN13 Android APK

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "scripts/set-android-min-sdk.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        working-directory: client
        run: flutter create . --platforms=android

      - name: Set Android minimum SDK
        run: python3 scripts/set-android-min-sdk.py client

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Build ARM64 APK
        working-directory: client
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN13-Android-ARM64
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
