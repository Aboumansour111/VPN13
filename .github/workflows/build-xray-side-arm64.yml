name: Build VPN13 Side Edition Xray ARM64 APK

on:
  push:
    branches:
      - feature/vpn13-side-arm64
    paths:
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/build-xray-side-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64-side:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PUB_CACHE: ${{ github.workspace }}\\.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Build and test ARM64 APK
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\\scripts\\build-apks.ps1"

      - name: Upload side edition APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VPN13-Xray-Android-ARM64-Side
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
