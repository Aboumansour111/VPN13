name: vpn13_client
description: VPN13 Android VPN client powered by Xray-core
publish_to: 'none'
version: 1.0.4+2006

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  xray_profile_parser:
    path: packages/xray_profile_parser

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/vpn13_icon.jpg
  adaptive_icon_background: "#001000"
  adaptive_icon_foreground: assets/icon/vpn13_icon.jpg
  adaptive_icon_foreground_inset: 12
  min_sdk_android: 23

flutter:
  uses-material-design: true
